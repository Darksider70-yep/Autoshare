# Only properties - no manual DataSource / EntityManager beans (auto-configured by Spring Boot)
spring.application.name=autoshare-backend
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:autosharedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom business property read by RideService via @Value
autoshare.campus.email-domain=@srmist.edu.in
