# ==============================================================================
# AUTOSHARE USER-MANAGEMENT SERVICE CONFIGURATION (Port 8081)
# ==============================================================================
server.port=8081
spring.application.name=user-management-service

# Dedicated in-memory database for users & KYC profiles (Database-Per-Service pattern)
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console on Port 8081
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

autoshare.campus.email-domain=@srmist.edu.in
