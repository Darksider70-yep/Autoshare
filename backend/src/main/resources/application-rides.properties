# ==============================================================================
# AUTOSHARE RIDE-BOOKING SERVICE CONFIGURATION (Port 8080)
# ==============================================================================
server.port=8080
spring.application.name=ride-booking-service

# Dedicated in-memory database for rides & bookings (Database-Per-Service pattern)
spring.datasource.url=jdbc:h2:mem:ridedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console on Port 8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Synchronous REST call target to User Management Microservice on Port 8081
autoshare.userservice.url=http://localhost:8081/api/users
autoshare.campus.email-domain=@srmist.edu.in
