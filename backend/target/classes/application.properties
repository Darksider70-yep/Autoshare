# ==============================================================================
# AUTOSHARE BACKEND CONFIGURATION
# Spring Boot auto-configuration reads these properties to setup beans automatically.
# No manual DataSource, EntityManagerFactory, or DispatcherServlet beans required!
# ==============================================================================

# Embedded Tomcat HTTP server port (Auto-configured by spring-boot-starter-web)
server.port=8080
spring.application.name=autoshare-backend

# In-memory H2 Database configuration (Auto-detected DataSource)
spring.datasource.url=jdbc:h2:mem:autosharedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Spring Data JPA / Hibernate auto-configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Business Rule Property: Campus email restriction
autoshare.campus.email-domain=@srmist.edu.in
