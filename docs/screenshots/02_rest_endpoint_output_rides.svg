<text x="28" y="595" fill="#fbbf24" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="13">    &quot;totalFare&quot;: 120.0, &quot;totalSeats&quot;: 3, &quot;seatsTaken&quot;: 3, &quot;seatsAvailable&quot;: 0, &quot;farePerPerson&quot;: 30.0,</text>
<text x="28" y="615" fill="#ef4444" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="13">    &quot;status&quot;: &quot;FULL&quot;                     // Automatically marked FULL when seatsTaken == totalSeats</text>
<text x="28" y="635" fill="#94a3b8" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="13">  }</text>
<text x="28" y="655" fill="#94a3b8" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="13">]</text>

</svg>