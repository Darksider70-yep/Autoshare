<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <filter id="browserShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Window -->
  <rect x="2" y="2" width="996" height="556" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#browserShadow)"/>

  <!-- Top Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 988 2 Q 998 2 998 12 L 998 82 L 2 82 Z" fill="#1e293b"/>
  <line x1="2" y1="82" x2="998" y2="82" stroke="#334155" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="24" r="6" fill="#ef4444"/>
  <circle cx="38" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="24" r="6" fill="#10b981"/>

  <!-- Tab Title -->
  <rect x="80" y="8" width="260" height="30" rx="6" fill="#0f172a"/>
  <text x="96" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛺 POST /api/microservices/simulate-flow — Inter-Service REST RPC Trace</text>

  <!-- Address Bar -->
  <rect x="80" y="46" width="880" height="28" rx="6" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  
  <rect x="86" y="50" width="50" height="20" rx="4" fill="#065f46"/>
  <text x="92" y="64" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="bold">POST</text>

  <text x="145" y="65" fill="#f8fafc" font-family="Consolas, monospace" font-size="12">http://localhost:8080/api/microservices/simulate-flow</text>

  <rect x="835" y="50" width="95" height="20" rx="4" fill="#065f46"/>
  <text x="842" y="64" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="bold">200 OK</text>

  <!-- Browser Content -->
  <text x="28" y="115" fill="#64748b" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">// Inter-Service Synchronous REST Call &amp; Circuit-Breaker RPC Pipeline</text>
<text x="28" y="135" fill="#f8fafc" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">{</text>
<text x="28" y="155" fill="#f43f5e" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;step1_Initiator&quot;: &quot;Ride-Booking-Service (Port 8080)&quot;,</text>
<text x="28" y="175" fill="#38bdf8" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;step2_Request&quot;: &quot;HTTP GET /api/users/verify/daksh.g@srmist.edu.in&quot;,</text>
<text x="28" y="195" fill="#a78bfa" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;step3_TargetService&quot;: &quot;User-Management-Service (Port 8081)&quot;,</text>
<text x="28" y="215" fill="#fbbf24" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;step4_JpaQuery&quot;: &quot;UserRepository.findByEmailIgnoreCase(&#39;daksh.g@srmist.edu.in&#39;)&quot;,</text>
<text x="28" y="235" fill="#f8fafc" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;step5_VerificationResult&quot;: {</text>
<text x="28" y="255" fill="#34d399" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;verified&quot;: true,</text>
<text x="28" y="275" fill="#f1f5f9" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;email&quot;: &quot;daksh.g@srmist.edu.in&quot;,</text>
<text x="28" y="295" fill="#fbbf24" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;registrationNumber&quot;: &quot;RA2411003012297&quot;,</text>
<text x="28" y="315" fill="#34d399" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;fullName&quot;: &quot;Daksh Gehlot&quot;,</text>
<text x="28" y="335" fill="#a78bfa" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;role&quot;: &quot;STUDENT_COMMUTER&quot;,</text>
<text x="28" y="355" fill="#34d399" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;status&quot;: &quot;VERIFIED&quot;,</text>
<text x="28" y="375" fill="#34d399" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;eligibleToRide&quot;: true,</text>
<text x="28" y="395" fill="#38bdf8" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">    &quot;message&quot;: &quot;User verified and authorized for campus ride-sharing&quot;</text>
<text x="28" y="415" fill="#f8fafc" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  },</text>
<text x="28" y="435" fill="#10b981" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;step6_Decision&quot;: &quot;ALLOW_RIDE_BOOKING&quot;,</text>
<text x="28" y="455" fill="#34d399" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;latencyMs&quot;: 14,</text>
<text x="28" y="475" fill="#10b981" font-weight="bold" font-family="Consolas, 'Courier New', monospace" font-size="12.5">  &quot;status&quot;: &quot;SUCCESS&quot;</text>
<text x="28" y="495" fill="#f8fafc" font-weight="normal" font-family="Consolas, 'Courier New', monospace" font-size="12.5">}</text>

</svg>